<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Nintendo Game Directory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>🎮 Nintendo Games</h1>
            <p>Discover Nintendo games</p>
        </div>
    </header>

    <main>
        <section class="controls">
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="🔍 Search games..."
                    class="search-input"
                    disabled
                >
            </div>
            
            <div class="filter-container">
                <select id="platformFilter" class="filter-select" disabled>
                    <option value="all">All Platforms</option>
                    <option value="Nintendo Switch">Nintendo Switch</option>
                </select>
                
                <select id="sortFilter" class="filter-select" disabled>
                    <option value="title">Sort by Title</option>
                    <option value="release_date">Sort by Release Date</option>
                    <option value="developer">Sort by Developer</option>
                </select>
            </div>
            
            <div class="action-container">
                <button id="loadGamesBtn" class="load-btn">
                    <span class="btn-icon">🎮</span>
                    Scraped Games
                </button>
                <span id="lastUpdated" class="last-updated"></span>
            </div>
            
            <div class="stats-container">
                <span id="gameCount">Click button to load games</span>
            </div>
        </section>

        <section class="games-grid" id="gamesGrid">
            <div class="welcome-message">
                <div class="welcome-content">
                    <span class="welcome-icon">🎮</span>
                    <h2>Welcome!</h2>
                    <p>Click the "Load Games" button to start.</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Data sourced from Nintendo</p>
        <p>© 2024 Nintendo Game Directory</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
